<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Flowers For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{
  --night1:#04020c;--night2:#0a0830;--water1:#0e1a45;--water2:#050a1c;--glow:#ff2d55;--lav:#ffd0da;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--night1);overflow:hidden;font-family:"Playfair Display",Georgia,serif;font-style:italic}
#stage{position:fixed;inset:0;overflow:hidden;background:linear-gradient(var(--night1),var(--night2) 55%,#0b1233 64%)}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw var(--t) ease-in-out var(--d) infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
.moon{position:absolute;top:calc(5vh + env(safe-area-inset-top,0px));right:8%;width:44px;height:44px;border-radius:50%;background:#fff8e0;box-shadow:0 0 30px 10px rgba(255,248,224,.3)}
.water{position:absolute;left:0;right:0;bottom:0;height:36%;background:linear-gradient(var(--water1),var(--water2));overflow:hidden}
.water::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 9px,rgba(150,170,255,.1) 9px 10px);animation:ripple 6s linear infinite}
.water::after{content:"";position:absolute;top:0;right:calc(8% + 8px);width:28px;height:70%;background:linear-gradient(rgba(255,248,224,.35),transparent);filter:blur(6px)}
@keyframes ripple{to{background-position:0 40px}}
.meteor{position:absolute;left:var(--x);top:var(--y);width:120px;height:2px;background:linear-gradient(90deg,#fff,transparent);opacity:0;animation:shoot 9s linear var(--d) infinite}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-35deg)}3%{opacity:1}13%,100%{opacity:0;transform:translate(-50vw,34vw) rotate(-35deg)}}

/* intro */
#open{position:absolute;inset:0;width:100%;border:0;background:none;color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;z-index:5;-webkit-tap-highlight-color:transparent}
#open:focus-visible{outline:3px solid #fff;outline-offset:-8px}
.tap{font:800 clamp(1.8rem,8vw,2.7rem)/1 "Nunito",system-ui,sans-serif;font-style:normal;letter-spacing:.14em;color:#fff;text-shadow:0 0 8px #fff,0 0 22px var(--glow),0 0 44px #c40f33;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{text-shadow:0 0 5px #fff,0 0 14px var(--glow),0 0 26px #c40f33}}
.bar{width:64px;height:2px;margin:16px 0 30px;background:#ff5a7a;box-shadow:0 0 10px #ff5a7a}
.heart{width:clamp(120px,36vw,180px);filter:drop-shadow(0 0 22px var(--glow));animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
.opened #open{pointer-events:none}
.opened .tap,.opened .bar{opacity:0;transition:opacity .5s}
.opened .heart{animation:none;transform:scale(3);opacity:0;transition:transform .9s ease-in,opacity .8s ease-in}

/* show */
#show{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(52px + env(safe-area-inset-bottom,0px));opacity:0;pointer-events:none;transition:opacity .9s;z-index:3}
#show.open{opacity:1}
h1{margin:0;text-align:center;font-weight:600;font-size:clamp(2.3rem,10vw,3.6rem);line-height:1.1;color:#ff6b88;text-shadow:0 0 12px rgba(255,45,85,.9),0 0 34px rgba(200,15,51,.7)}
.open h1{animation:title 2s ease-out .2s backwards}
@keyframes title{from{opacity:0;letter-spacing:.3em;filter:blur(8px)}}
svg.b{height:min(47vh,430px);width:auto;max-width:92vw;overflow:visible;transform-origin:50% 100%;filter:drop-shadow(0 0 10px rgba(255,45,85,.5));animation:float 6s ease-in-out infinite,glow 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-6px) rotate(1.2deg)}}
@keyframes glow{50%{filter:drop-shadow(0 0 20px rgba(255,70,100,.8))}}
.st{fill:none;stroke:#58b36b;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1}
.open .st{animation:draw 1.3s ease-out var(--d) backwards}
@keyframes draw{from{stroke-dashoffset:1}}
.hd,.lf{transform-origin:0 30px}
.lf{transform-origin:200px 396px}
.open .hd{animation:bud 1s cubic-bezier(.3,1.5,.5,1) calc(var(--d) + 1.1s) backwards}
.open .lf{animation:bud .9s ease-out var(--d) backwards}
@keyframes bud{from{transform:scale(0)}}
.bl{transform:rotate(-10deg);transform-origin:0 30px}
.br{transform:rotate(10deg);transform-origin:0 30px}
.open .bl{animation:openL 1.5s ease-out calc(var(--d) + 1.5s) backwards}
.open .br{animation:openR 1.5s ease-out calc(var(--d) + 1.5s) backwards}
@keyframes openL{from{transform:rotate(2deg)}}
@keyframes openR{from{transform:rotate(-2deg)}}
.open .cone{animation:fade 1s .1s backwards}
@keyframes fade{from{opacity:0;transform:translateY(14px)}}
.msg{text-align:center;color:var(--lav);font-size:clamp(1.05rem,4.6vw,1.4rem);line-height:1.5;text-shadow:0 0 12px rgba(255,45,85,.6);position:relative;width:min(92vw,520px);height:4.6em}
.msg p{margin:0;position:absolute;left:0;right:0;top:0;opacity:0}
.open .msg p{animation:msg 36s ease-in-out var(--d) infinite}
@keyframes msg{0%{opacity:0;transform:translateY(10px)}3%,13%{opacity:1;transform:none}16%,100%{opacity:0}}
.sk{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffc2cf;box-shadow:0 0 10px 3px var(--glow);animation:rise var(--t) ease-in-out var(--d) infinite;opacity:0}
@keyframes rise{0%{opacity:0;transform:translateY(0)}30%,70%{opacity:.9}100%{opacity:0;transform:translateY(-70px)}}
#replay{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font:600 1rem "Playfair Display",serif;font-style:italic;color:var(--lav);background:#ffffff14;border:1px solid #ffffff30;border-radius:999px;padding:5px 18px;cursor:pointer}
.open #replay{pointer-events:auto}
#replay:focus-visible{outline:3px solid #fff;outline-offset:3px}
.lf2,.fn{transform-origin:0 0}
.open .lf2{animation:bud .8s ease-out var(--d) backwards}
.open .fn{animation:bud 1s ease-out 1.4s backwards}
#rain{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity 1.5s}
.opened #rain{opacity:1;transition-delay:1.6s}
.fr{position:absolute;top:-40px;left:var(--x);animation:frfall var(--t) linear var(--d) infinite}
.fr svg{width:var(--s);height:var(--s);display:block;opacity:.85;animation:frsway var(--w) ease-in-out infinite alternate}
@keyframes frfall{to{transform:translateY(calc(100vh + 80px))}}
@keyframes frsway{from{transform:translateX(-16px) rotate(-25deg)}to{transform:translateX(16px) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.meteor,.sk,.fr{display:none}.msg p:first-child{opacity:1}}
</style>
</head>
<body>
<div id="stage">
  <div id="stars"></div>
  <div class="moon"></div>
  <div class="meteor" style="--x:72%;--y:6%;--d:2s"></div>
  <div class="meteor" style="--x:95%;--y:18%;--d:6.5s"></div>
  <div class="water"></div>

  <div id="rain"></div>
  <button id="open" aria-label="Tap to open">
    <span class="tap">TAP TO OPEN</span>
    <span class="bar"></span>
    <svg class="heart" viewBox="0 0 100 90" aria-hidden="true">
      <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b81"/><stop offset="1" stop-color="#c4102f"/></linearGradient></defs>
      <path d="M50 86C10 56 2 36 10 20 18 4 40 6 50 24 60 6 82 4 90 20 98 36 90 56 50 86Z" fill="url(#hg)"/>
      <ellipse cx="29" cy="25" rx="9" ry="5.5" fill="#fff" fill-opacity=".55" transform="rotate(-35 29 25)"/>
    </svg>
  </button>

  <div id="show">
    <h1>Flowers For You</h1>
    <svg class="b" id="bq" viewBox="0 0 400 460" aria-label="A bouquet of glowing red tulips"></svg>
    <div class="msg">
      <p style="--d:6s">Every flower here is for you, Archana.</p>
      <p style="--d:11s">You are the calm in my busiest days.</p>
      <p style="--d:16s">Your smile is my favourite place to rest.</p>
      <p style="--d:21s">With you, even ordinary moments bloom.</p>
      <p style="--d:26s">I hope this garden makes you smile as much as you make me smile.</p>
      <p style="--d:31s">I’m so glad it’s you. — Subash</p>
    </div>
    <div id="sparks"></div>
    <button id="replay">Replay</button>
  </div>
</div>

<script>
(function(){
  function rnd(a,b){return a+Math.random()*(b-a)}
  var i,out='',W=window.innerWidth;
  for(i=0;i<(W<600?70:120);i++){var s=rnd(1,2.8).toFixed(1);out+='<i class="star" style="left:'+rnd(0,100).toFixed(1)+'%;top:'+rnd(0,64).toFixed(1)+'%;width:'+s+'px;height:'+s+'px;--t:'+rnd(2,5).toFixed(1)+'s;--d:-'+rnd(0,5).toFixed(1)+'s"></i>'}
  document.getElementById('stars').innerHTML=out;

  var defs='<defs>'+
   '<radialGradient id="pf" cx=".38" cy=".32" r=".85"><stop offset="0" stop-color="#ff8a98"/><stop offset=".55" stop-color="#e0112f"/><stop offset="1" stop-color="#8f0a22"/></radialGradient>'+
   '<linearGradient id="pm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d3152f"/><stop offset="1" stop-color="#6e0a1c"/></linearGradient>'+
   '<linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3f9a5a"/><stop offset="1" stop-color="#86e29e"/></linearGradient>'+
   '<linearGradient id="pw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8506c"/><stop offset="1" stop-color="#7a1230"/></linearGradient></defs>';
  function fern(ox,oy,ang,len){
    var s='<path d="M0,0Q'+(len*.12)+','+(-len/2)+' 0,'+(-len)+'" stroke="#4fae6a" stroke-width="2" fill="none" stroke-linecap="round"/>';
    for(var j=1;j<=9;j++){var y=-j*len/10,w=15*(1-j/11)+3;
      s+='<path d="M0,'+y+'L'+(-w)+','+(y-7)+'M0,'+y+'L'+w+','+(y-7)+'" stroke="#58b36b" stroke-width="2.4" stroke-linecap="round" fill="none"/>';}
    return '<g transform="translate('+ox+' '+oy+') rotate('+ang+')"><g class="fn">'+s+'</g></g>';
  }
  var F=[[196,54,1.2],[130,72,1.1],[266,66,1.15],[78,112,1.05],[330,106,1.05],[165,100,1.1],[232,96,1.1],[48,172,1],[356,166,1],[112,150,1.05],[290,146,1.05],[200,140,1.15],[140,200,1],[262,196,1]];
  var stems='',heads='',leaves='';
  F.forEach(function(f,k){
    var x=f[0],y=f[1],sc=f[2],ex=x,ey=y+30*sc,cx=200+(x-200)*.46+(k%2?5:-5),cy=392-(392-ey)*.5;
    var a=Math.atan2(ex-cx,cy-ey)*180/Math.PI,d=(.5+k*.3).toFixed(2);
    stems+='<path class="st" pathLength="1" style="--d:'+d+'s" d="M200,392Q'+cx.toFixed(0)+','+cy.toFixed(0)+' '+ex+','+ey.toFixed(0)+'"/>';
    [[.36,k%2?1:-1],[.62,k%2?-1:1]].forEach(function(l){
      var t=l[0],u=1-t,px=u*u*200+2*u*t*cx+t*t*ex,py=u*u*392+2*u*t*cy+t*t*ey,th=-90+a+l[1]*55;
      leaves+='<g transform="translate('+px.toFixed(0)+' '+py.toFixed(0)+') rotate('+th.toFixed(0)+') scale(1.15)"><g class="lf2" style="--d:'+(+d+.8+t).toFixed(2)+'s"><path d="M0,0C10,-9 32,-9 48,0 32,9 10,9 0,0Z" fill="url(#lg)"/><path d="M3,0L42,0" stroke="#1f6b3a" stroke-opacity=".45" stroke-width="1.2" fill="none"/></g></g>';
    });
    heads+='<g transform="translate('+ex+' '+ey.toFixed(0)+') rotate('+a.toFixed(1)+') scale('+sc+') translate(0 -30)" style="--d:'+d+'s"><g class="hd">'+
      '<path class="bl" d="M-26,-14C-30,6 -24,30 -4,31 -10,12 -9,-10 -10,-30 -16,-32 -24,-26 -26,-14Z" fill="url(#pm)"/>'+
      '<path class="br" d="M26,-14C30,6 24,30 4,31 10,12 9,-10 10,-30 16,-32 24,-26 26,-14Z" fill="url(#pm)"/>'+
      '<path d="M0,31C-16,29 -20,6 -17,-12 -15,-24 -8,-31 0,-32 8,-31 15,-24 17,-12 20,6 16,29 0,31Z" fill="url(#pf)"/>'+
      '<path d="M-8,-29C-11,-10 -9,12 -4,28M8,-29C11,-10 9,12 4,28" stroke="#5a0716" stroke-opacity=".4" stroke-width="1.5" fill="none" stroke-linecap="round"/>'+
      '<ellipse cx="-9" cy="-6" rx="3.6" ry="12" fill="#fff" fill-opacity=".5" transform="rotate(8 -9 -6)"/></g></g>';
  });
  var cone='<g class="cone"><path d="M118,330Q200,312 282,330L216,456Q200,462 184,456Z" fill="url(#pw)" fill-opacity=".94"/>'+
    '<path d="M282,330L216,456 198,458Q248,400 282,330Z" fill="#3a0014" fill-opacity=".35"/>'+
    '<path d="M118,330Q150,400 188,458L198,458Q172,390 148,334Z" fill="#fff" fill-opacity=".16"/>'+
    '<path d="M160,340L196,452M240,340L206,452" stroke="#fff" stroke-opacity=".18" stroke-width="1.5" fill="none"/>'+
    '<path d="M118,330Q200,312 282,330" fill="none" stroke="#ffb3c2" stroke-opacity=".6" stroke-width="3"/>'+
    '<path d="M200,410C172,390 152,408 170,423 182,431 196,420 200,410Z M200,410C228,390 248,408 230,423 218,431 204,420 200,410Z" fill="#ffd166"/><circle cx="200" cy="412" r="6" fill="#ffe9a8"/></g>'+
    fern(150,438,-68,64)+fern(162,446,-36,56)+fern(250,438,68,64)+fern(238,446,36,56);
  document.getElementById('bq').innerHTML=defs+stems+leaves+cone+heads;

  out='';
  for(i=0;i<30;i++)out+='<i class="sk" style="left:'+rnd(14,86).toFixed(0)+'%;top:'+rnd(28,78).toFixed(0)+'%;--t:'+rnd(3,6).toFixed(1)+'s;--d:'+rnd(3,9).toFixed(1)+'s"></i>';
  document.getElementById('sparks').innerHTML=out;

  var rc=['#ff5a76','#ff8fa3','#e0112f','#ffc2cf','#ff7a90'],rain='';
  for(i=0;i<(W<600?34:60);i++){
    var c=rc[Math.floor(Math.random()*rc.length)],sz=rnd(14,26).toFixed(0),b='';
    if(Math.random()<.65){for(var q=0;q<5;q++){var an=q*72*Math.PI/180;b+='<circle cx="'+(20+11*Math.sin(an)).toFixed(1)+'" cy="'+(20-11*Math.cos(an)).toFixed(1)+'" r="8.5" fill="'+c+'"/>'}b+='<circle cx="20" cy="20" r="5" fill="#ffd166"/>'}
    else b='<path d="M20,4C34,14 34,30 20,38 6,30 6,14 20,4Z" fill="'+c+'"/>';
    rain+='<div class="fr" style="--x:'+rnd(0,98).toFixed(1)+'%;--s:'+sz+'px;--t:'+rnd(11,18).toFixed(1)+'s;--d:-'+rnd(0,16).toFixed(1)+'s;--w:'+rnd(2.5,4.5).toFixed(1)+'s"><svg viewBox="0 0 40 40" aria-hidden="true">'+b+'</svg></div>';
  }
  document.getElementById('rain').innerHTML=rain;

  var stage=document.getElementById('stage'),show=document.getElementById('show');
  document.getElementById('open').addEventListener('click',function(){
    stage.classList.add('opened');
    setTimeout(function(){show.classList.add('open')},650);
  });
  document.getElementById('replay').addEventListener('click',function(){
    show.classList.remove('open');stage.classList.remove('opened');
  });
})();
</script>
</body>
</html>
